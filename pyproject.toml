[project]
name = "panel-guide"
version = "0.1.0"
description = "A cooperative maze environment for text Expert and visual Operator RL."
requires-python = ">=3.11"
dependencies = [
    "pillow>=10.1",
    "python-dotenv>=1.2.4",
]

[project.optional-dependencies]
models = [
    "tinker>=0.35.0",
    "tinker-cookbook>=0.5.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["panel_guide"]
